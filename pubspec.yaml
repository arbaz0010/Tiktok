name: flutter_awesome_reels
description: A clean, high-performance Flutter widget for video reels.
version: 1.0.0

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core Video & Scrolling functionality
  video_player: ^2.10.0
  visibility_detector: ^0.4.0+2
  
  # Network & Caching
  http: ^1.2.0
  path_provider: ^2.1.5
  
  # UI & Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
